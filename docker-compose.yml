services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wellness-helper-app
    container_name: wellness-helper
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Point Prisma to the mapped volume path
      - DATABASE_URL=file:/app/prisma/dev.db
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      # Map the local prisma folder (containing dev.db) to /app/prisma
      # This ensures persistence and that schema.prisma is available if needed
      - ./prisma:/app/prisma

  nginx:
    image: nginx:alpine
    container_name: wellness-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app

networks:
  default:
    driver: bridge
