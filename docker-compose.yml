version: '3.8'

services:
  aura-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-mood
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./data/aura.db
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - ntfy

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: aura-ntfy
    ports:
      - "8080:80"
    volumes:
      - ./ntfy-data:/var/cache/ntfy
      - ./ntfy-config:/etc/ntfy
    command:
      - serve
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
  ntfy-data:
  ntfy-config:
